<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Mi día</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #e9eef2;
        --panel: #f8fafb;
        --ink: #14263a;
        --mute: #5d6f80;
        --line: #cfd9e1;
        --accent: #1f6f6b;
        --accent-ink: #fff;
        --hi: #c2410c;
        --c-trabajo: #2457c5;
        --c-casa: #a16207;
        --c-estudio: #7e3fb0;
        --c-otros: #4b6b57;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0f1a24;
          --panel: #172531;
          --ink: #e6eef5;
          --mute: #93a6b6;
          --line: #2a3b49;
          --accent: #47b5ad;
          --accent-ink: #06201e;
          --hi: #fb923c;
          --c-trabajo: #7fa6ff;
          --c-casa: #e3b341;
          --c-estudio: #c79bf0;
          --c-otros: #8fbf9f;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0f1a24;
        --panel: #172531;
        --ink: #e6eef5;
        --mute: #93a6b6;
        --line: #2a3b49;
        --accent: #47b5ad;
        --accent-ink: #06201e;
        --hi: #fb923c;
        --c-trabajo: #7fa6ff;
        --c-casa: #e3b341;
        --c-estudio: #c79bf0;
        --c-otros: #8fbf9f;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          400 16px/1.5 Figtree,
          system-ui,
          sans-serif;
      }
      .wrap {
        max-width: 1040px;
        margin: 0 auto;
        padding: 28px 18px 60px;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 22px;
      }
      h1 {
        font:
          800 clamp(2rem, 6vw, 3.2rem)/1 "Bricolage Grotesque",
          Figtree,
          sans-serif;
        margin: 0;
        letter-spacing: -0.02em;
      }
      .fecha {
        color: var(--mute);
        margin: 6px 0 0;
        text-transform: capitalize;
      }
      .prog {
        min-width: 240px;
        flex: 1;
        max-width: 380px;
      }
      .prog b {
        font:
          800 2.4rem/1 "Bricolage Grotesque",
          Figtree,
          sans-serif;
      }
      .prog span {
        color: var(--mute);
        margin-left: 6px;
      }
      .bar {
        height: 12px;
        border-radius: 99px;
        background: var(--line);
        overflow: hidden;
        margin-top: 8px;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--accent);
        border-radius: 99px;
        transition: width 0.4s ease;
      }
      form {
        display: grid;
        grid-template-columns: 1fr repeat(3, auto) auto;
        gap: 8px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px;
        margin-bottom: 16px;
      }
      input[type="text"],
      select {
        font: inherit;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 10px 12px;
        min-width: 0;
      }
      label.chk {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--mute);
        font-size: 0.9rem;
        padding: 0 6px;
        white-space: nowrap;
      }
      button {
        font:
          600 1rem Figtree,
          sans-serif;
        cursor: pointer;
        border: 0;
        border-radius: 9px;
        padding: 10px 18px;
        background: var(--accent);
        color: var(--accent-ink);
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .filtros {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 18px;
      }
      .filtros button {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
        padding: 6px 14px;
        border-radius: 99px;
        font-weight: 500;
      }
      .filtros button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }
      .cols {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .col {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        min-height: 160px;
      }
      .col h2 {
        font:
          600 1.15rem "Bricolage Grotesque",
          Figtree,
          sans-serif;
        margin: 0 0 10px;
        display: flex;
        justify-content: space-between;
      }
      .col h2 small {
        color: var(--mute);
        font:
          400 0.85rem Figtree,
          sans-serif;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }
      li {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px;
        border: 1px solid var(--line);
        border-left: 5px solid var(--cat, var(--line));
        border-radius: 9px;
        background: var(--bg);
      }
      li input {
        width: 20px;
        height: 20px;
        margin-top: 2px;
        accent-color: var(--accent);
        flex: none;
      }
      li .t {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      li.hecha .t {
        text-decoration: line-through;
        color: var(--mute);
      }
      .meta {
        display: block;
        font-size: 0.8rem;
        color: var(--mute);
      }
      .alta {
        color: var(--hi);
        font-weight: 600;
      }
      li .x {
        background: transparent;
        color: var(--mute);
        padding: 0 6px;
        font-size: 1.2rem;
        line-height: 1.2;
      }
      .vacio {
        color: var(--mute);
        font-size: 0.92rem;
        margin: 4px 0;
      }
      .pie {
        margin-top: 22px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .pie button {
        background: transparent;
        color: var(--mute);
        border: 1px solid var(--line);
        font-weight: 500;
        padding: 6px 14px;
      }
      @media (max-width: 820px) {
        .cols {
          grid-template-columns: 1fr;
        }
        form {
          grid-template-columns: 1fr 1fr;
        }
        form input[type="text"] {
          grid-column: 1/-1;
        }
        form button {
          grid-column: 1/-1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar i {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>Mi día</h1>
          <p class="fecha" id="fecha"></p>
        </div>
        <div class="prog">
          <b id="pct">0%</b><span id="cuenta">0 de 0 hechas</span>
          <div class="bar"><i id="barra"></i></div>
        </div>
      </header>

      <form id="f">
        <input
          type="text"
          id="titulo"
          placeholder="Nueva tarea o trabajo"
          aria-label="Nueva tarea o trabajo"
          required
          maxlength="120"
        />
        <select id="cat" aria-label="Categoría">
          <option value="trabajo">Trabajo</option>
          <option value="casa">Casa</option>
          <option value="estudio">Estudio</option>
          <option value="otros">Otros</option>
        </select>
        <select id="bloque" aria-label="Momento del día">
          <option value="manana">Mañana</option>
          <option value="tarde">Tarde</option>
          <option value="noche">Noche</option>
        </select>
        <select id="prio" aria-label="Prioridad">
          <option value="normal">Normal</option>
          <option value="alta">Prioridad alta</option>
        </select>
        <button type="submit">Agregar</button>
        <label class="chk"
          ><input type="checkbox" id="diaria" /> Repetir cada día</label
        >
      </form>

      <div class="filtros" id="filtros" role="group" aria-label="Filtrar">
        <button type="button" data-f="todas" aria-pressed="true">Todas</button>
        <button type="button" data-f="pend" aria-pressed="false">
          Pendientes
        </button>
        <button type="button" data-f="hechas" aria-pressed="false">
          Hechas
        </button>
        <button type="button" data-f="alta" aria-pressed="false">
          Prioridad alta
        </button>
      </div>

      <div class="cols" id="cols"></div>

      <div class="pie">
        <button type="button" id="limpiar">Borrar tareas hechas</button>
        <button type="button" id="tema">Cambiar tema</button>
      </div>
    </div>

    <script>
      (function () {
        var KEY = "mi-dia-v1";
        var BLOQUES = [
          ["manana", "Mañana"],
          ["tarde", "Tarde"],
          ["noche", "Noche"],
        ];
        var CATS = {
          trabajo: "Trabajo",
          casa: "Casa",
          estudio: "Estudio",
          otros: "Otros",
        };
        var hoy = new Date().toISOString().slice(0, 10);
        var estado = { dia: hoy, tareas: [] };
        var filtro = "todas";

        try {
          var raw = localStorage.getItem(KEY);
          if (raw) {
            estado = JSON.parse(raw) || estado;
          }
        } catch (e) {}
        if (!Array.isArray(estado.tareas)) estado.tareas = [];
        // Nuevo día: las diarias vuelven a pendientes, las demás hechas se limpian
        if (estado.dia !== hoy) {
          estado.tareas = estado.tareas.filter(function (t) {
            return t.diaria || !t.hecha;
          });
          estado.tareas.forEach(function (t) {
            if (t.diaria) t.hecha = false;
          });
          estado.dia = hoy;
        }
        function guardar() {
          try {
            localStorage.setItem(KEY, JSON.stringify(estado));
          } catch (e) {}
        }

        document.getElementById("fecha").textContent =
          new Date().toLocaleDateString("es-AR", {
            weekday: "long",
            day: "numeric",
            month: "long",
          });

        function visible(t) {
          if (filtro === "pend") return !t.hecha;
          if (filtro === "hechas") return t.hecha;
          if (filtro === "alta") return t.prio === "alta";
          return true;
        }

        function render() {
          var cols = document.getElementById("cols");
          cols.textContent = "";
          BLOQUES.forEach(function (b) {
            var lista = estado.tareas.filter(function (t) {
              return t.bloque === b[0];
            });
            var mostrar = lista.filter(visible).sort(function (a, c) {
              return (
                a.hecha - c.hecha || (c.prio === "alta") - (a.prio === "alta")
              );
            });
            var col = document.createElement("section");
            col.className = "col";
            var h = document.createElement("h2");
            h.textContent = b[1];
            var s = document.createElement("small");
            s.textContent =
              lista.filter(function (t) {
                return t.hecha;
              }).length +
              "/" +
              lista.length;
            h.appendChild(s);
            col.appendChild(h);
            if (!mostrar.length) {
              var v = document.createElement("p");
              v.className = "vacio";
              v.textContent = lista.length
                ? "Nada con este filtro."
                : "Sin tareas. Agregá una arriba.";
              col.appendChild(v);
            } else {
              var ul = document.createElement("ul");
              mostrar.forEach(function (t) {
                var li = document.createElement("li");
                li.style.setProperty("--cat", "var(--c-" + t.cat + ")");
                if (t.hecha) li.className = "hecha";
                var cb = document.createElement("input");
                cb.type = "checkbox";
                cb.checked = t.hecha;
                cb.setAttribute("aria-label", "Marcar como hecha: " + t.titulo);
                cb.addEventListener("change", function () {
                  t.hecha = cb.checked;
                  guardar();
                  render();
                });
                var d = document.createElement("div");
                d.className = "t";
                d.appendChild(document.createTextNode(t.titulo));
                var m = document.createElement("span");
                m.className = "meta";
                m.textContent = CATS[t.cat] + (t.diaria ? " · Diaria" : "");
                if (t.prio === "alta") {
                  var p = document.createElement("span");
                  p.className = "alta";
                  p.textContent = " · Prioridad alta";
                  m.appendChild(p);
                }
                d.appendChild(m);
                var x = document.createElement("button");
                x.type = "button";
                x.className = "x";
                x.textContent = "×";
                x.setAttribute("aria-label", "Borrar tarea: " + t.titulo);
                x.addEventListener("click", function () {
                  estado.tareas = estado.tareas.filter(function (o) {
                    return o !== t;
                  });
                  guardar();
                  render();
                });
                li.appendChild(cb);
                li.appendChild(d);
                li.appendChild(x);
                ul.appendChild(li);
              });
              col.appendChild(ul);
            }
            cols.appendChild(col);
          });
          var tot = estado.tareas.length,
            ok = estado.tareas.filter(function (t) {
              return t.hecha;
            }).length;
          var pct = tot ? Math.round((ok / tot) * 100) : 0;
          document.getElementById("pct").textContent = pct + "%";
          document.getElementById("cuenta").textContent =
            ok + " de " + tot + " hechas";
          document.getElementById("barra").style.width = pct + "%";
        }

        document.getElementById("f").addEventListener("submit", function (e) {
          e.preventDefault();
          var ti = document.getElementById("titulo");
          var v = ti.value.trim();
          if (!v) return;
          estado.tareas.push({
            id: Date.now(),
            titulo: v,
            cat: document.getElementById("cat").value,
            bloque: document.getElementById("bloque").value,
            prio: document.getElementById("prio").value,
            diaria: document.getElementById("diaria").checked,
            hecha: false,
          });
          ti.value = "";
          ti.focus();
          guardar();
          render();
        });

        document
          .getElementById("filtros")
          .addEventListener("click", function (e) {
            var b = e.target.closest("button");
            if (!b) return;
            filtro = b.dataset.f;
            Array.prototype.forEach.call(
              this.querySelectorAll("button"),
              function (x) {
                x.setAttribute("aria-pressed", x === b);
              },
            );
            render();
          });

        document
          .getElementById("limpiar")
          .addEventListener("click", function () {
            estado.tareas = estado.tareas.filter(function (t) {
              return !t.hecha || t.diaria;
            });
            guardar();
            render();
          });

        document.getElementById("tema").addEventListener("click", function () {
          var r = document.documentElement;
          var oscuro =
            r.getAttribute("data-theme") === "dark" ||
            (!r.getAttribute("data-theme") &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          r.setAttribute("data-theme", oscuro ? "light" : "dark");
        });

        render();
      })();
    </script>
  </body>
</html>
